<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Result Checker</title>
</head>
<body>

    <script>
        // 1. Take student marks using prompt() and convert it to a Number
        var marks = Number(prompt("Enter your marks:"));

        // 2 & 3. If marks are 50 or above, display "Pass". Otherwise, display nothing.
        if (marks >= 50) {
            alert("Pass");
        }
    </script>

</body>
</html>
